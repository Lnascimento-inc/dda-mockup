function draw(top=true){
 const content=by("app-content"), oldScroll=content.scrollTop;
 const [h,b,f]=screens[screen]();
 by("app-header").className="app-header";by("app-header").innerHTML=h;

function makeDiary(work,spec={}){
 const source=data.diarios.find(d=>d.id===spec.copia);
 const previous=data.diarios.find(d=>d.obra===work&&d.data===(spec.data||today));
 if(previous) return previous;
 const d={id:id(),obra:work,data:spec.data||today,autor:"Rafael Lima",status:"Rascunho",envio:"Salvo no aparelho",fotos:[],historico:[],jornada:{...source?.jornada}};
 for(const name of ["atividades","ocorrencias","equipe","equipamentos","materiais","observacoes"])d[name]=source?[...source[name]]:[];
 data.diarios.unshift(d);save();return d;
}

 const adminItems=admin()?[row("Dados da empresa","Identificação do PDF","route","empresa","","works"),row("Usuários","Perfis e acessos à obra","route","usuarios","","people"),row("Catálogos","Pessoas, funções e equipamentos","route","catalogos","","file")]:[];
 openSheet("Mais",`<div class="stack">${row("Meu perfil",data.perfil,"route","perfil","","people")}${adminItems.join("")}${filterButtons(["Administrador","Preenchimento","Revisão"],data.perfil,"role")}${button(data.offline?"Voltar a ficar online":"Simular falta de conexão","offline","","secondary","cloud")}${button("Ir para uma tela","screen-list","","ghost","menu")}${button("Sair da demonstração","route","entrar","","back")}</div>`);
}

 openSheet("Novo diário ou cópia",getForm("new-diary",`${field("Data do diário","data",today,"date",true)}

const entryLabels={atividades:"Atividade",ocorrencias:"Ocorrência",equipe:"Mão de obra",equipamentos:"Equipamento",materiais:"Material",observacoes:"Observação"};
function openEntry(value){
 const [type,current]=value.split(":");
 if(!entryLabels[type])return;
 const old=current===undefined?"":diario()[type][Number(current)]||"";
 let fields=area("Descrição","descricao",old,true);
 if(type==="equipe"||type==="equipamentos"){
  const options=type==="equipe"?[...data.catalogos.Pessoas.map(x=>x.nome),...data.catalogos.Funções.map(x=>x.nome)]:data.catalogos.Equipamentos.map(x=>x.nome);
  const [amount="",name=""]=old.split(" · ");
  fields=select(type==="equipe"?"Pessoa ou função":"Equipamento","nome",["",...new Set([...options,...(name?[name]:[])])],name)+field("Quantidade","quantidade",amount||1,"number",true);
 }
 if(type==="materiais"){
  const [amount="",name=""]=old.split(" · ");
  const [quantity,unit]=amount.split(/\s+(.*)/);
  fields=field("Material","nome",name,"text",true)+`<div class="fields-two">${field("Quantidade","quantidade",quantity,"number",true)}${field("Unidade","unidade",unit,"text",true)}</div>`;
 }
 openSheet((old?"Editar ":"Adicionar ")+entryLabels[type].toLowerCase(),getForm("entry",`<input type="hidden" name="kind" value="${type}"><input type="hidden" name="item" value="${esc(current??"")}">${fields}${submit("Salvar lançamento")}`));
}

 const climate=[["Manhã","manha"],["Tarde","tarde"],["Noite","noite"]].map(([label,k])=>`<p class="eyebrow">${label}</p><div class="fields-two">${select("Clima",k,["","Claro","Nublado","Chuvoso"],j[k])}${select("Condição","cond"+k,["","Praticável","Impraticável"],j["cond"+k])}</div>`).join("");
 openSheet("Jornada e clima",getForm("hours",`<div class="fields-two">${field("Entrada","entrada",j.entrada,"time")}${field("Saída","saida",j.saida,"time")}${field("Início do intervalo","inicio",j.inicio,"time")}${field("Fim do intervalo","fim",j.fim,"time")}</div>${climate}${submit("Aplicar")}`));
}

 if(diario().status!=="Em revisão"||!podeRevisar())return;

function openCatalogItem(value){
 const old=data.catalogos[ctx.catalogo].find(x=>x.id===value)||{};

}
function startSignature(){
 const canvas=by("signature"), c=canvas.getContext("2d");
 canvas.dataset.signed="";c.lineWidth=4;c.lineCap="round";c.strokeStyle="#243d58";
 const coords=e=>{const r=canvas.getBoundingClientRect();return[(e.clientX-r.left)*canvas.width/r.width,(e.clientY-r.top)*canvas.height/r.height];};
 canvas.addEventListener("pointerdown",e=>{canvas.setPointerCapture(e.pointerId);c.beginPath();c.moveTo(...coords(e));});
 canvas.addEventListener("pointermove",e=>{if(!canvas.hasPointerCapture(e.pointerId))return;c.lineTo(...coords(e));c.stroke();canvas.dataset.signed="true";});
}
function openMedia(){openSheet("Adicionar mídia",`<div class="stack">${button("Tirar foto","camera","","","camera")}${button("Escolher imagem","image-picker","","secondary","camera")}${button("Anexar documento","doc-picker","","secondary","file")}</div>`);}
function pickFile(mode){
 if(mode==="document"&&data.offline){tell("Conecte-se à internet para anexar documentos.");return;}
 const input=document.createElement("input");
 input.type="file";
 input.accept=mode==="document"?".pdf,.docx,.txt":"image/jpeg,image/png,image/webp";
 if(mode==="camera")input.capture="environment";
 input.addEventListener("change",()=>{
  const file=input.files?.[0];
  if(!file)return;
  closeSheet();
  if(mode==="document"){diario().fotos.push({src:"",nome:file.name});save();draw(false);tell("Documento adicionado à demonstração.");return;}
  if(file.size>1_500_000){tell("Use uma imagem de até 1,5 MB na demonstração.");return;}
  const reader=new FileReader();
  reader.onload=()=>{diario().fotos.push({src:String(reader.result),nome:file.name});const kept=save();openSection="fotos";draw(false);tell(kept?"Foto salva no aparelho.":"Foto disponível nesta sessão.");};
  reader.readAsDataURL(file);
 });
 input.click();
}
function openDiary(value,edit=false){
 const d=data.diarios.find(x=>x.id===value);
 if(!d)return;
 ctx.diario=d.id;ctx.obra=d.obra;
 const editing=edit&&podeEditar()&&["Rascunho","Devolvido"].includes(d.status);
 openSection=editing?"eventos":"";
 next(editing?"editor":"visualizar");
}

 const d=data.diarios.find(x=>x.id===value);
 if(!d)return;
 if(data.offline){tell("Sem conexão para enviar.");return;}
 d.envio="Salvo online";save();draw(false);tell("Envio simulado concluído.");
}
const actions={
 route:to=>{if(to==="envios")ctx.enviosObra="";next(to);},
 back,
 close:closeSheet,
 reset:()=>{data=seed();save();stack=[];ctx.busca="";ctx.enviosObra="";ctx.obra="araucaria";ctx.diario="hoje";next("obras");tell("Demonstração reiniciada.");},
 more:openMore,
 "screen-list":()=>openSheet("Ir para uma tela",group("",Object.entries(titles).map(([route,title])=>row(title,"","jump",route,"","next")))),
 jump:jump,
 role:value=>{data.perfil=value;save();draw(false);openMore();tell("Perfil de demonstração alterado.");},
 offline:()=>{data.offline=!data.offline;save();draw(false);openMore();tell(data.offline?"Conexão indisponível simulada.":"Conexão restabelecida.");},
 obra:value=>{ctx.obra=value;next("resumo");},
 "Nova obra":()=>{ctx.editObra=false;next("cadastro-obra");},
 "Editar obra":()=>{ctx.editObra=true;next("cadastro-obra");},
 "diary-list":value=>{ctx.filtro=value;ctx.fromDate="";ctx.toDate="";ctx.showFilters=false;next("diarios");},
 "work-queue":value=>{ctx.enviosObra=value;next("envios");},
 Filtros:()=>{ctx.showFilters=!ctx.showFilters;draw(false);},
 "diary-filter":value=>{ctx.filtro=value;draw(false);},
 "clear-filter":()=>{ctx.filtro="Todos";ctx.fromDate="";ctx.toDate="";draw(false);},
 "new-diary":openNewDiary,
 "create-today":value=>openDiary(makeDiary(value).id,true),
 "edit-diary":value=>openDiary(value,true),
 "open-diary":value=>{const d=data.diarios.find(x=>x.id===value);openDiary(value,!!d&&["Rascunho","Devolvido"].includes(d.status));},
 "submit-form":value=>document.querySelector(`form[data-form="${value}"]`)?.requestSubmit(),
 date:()=>openSheet("Alterar data",getForm("date",field("Data do diário","data",diario().data,"date",true)+submit("Salvar data"))),
 entry:openEntry,
 "remove-entry":value=>{
   const [kind,index]=value.split(":");
   const item=diario()[kind]?.[Number(index)];
   if(!item)return;
   openSheet("Remover lançamento",`<p class="meta">${esc(item)}</p>${button("Remover","confirm-remove",value,"danger")}`);
 },
 "confirm-remove":value=>{const [kind,index]=value.split(":");diario()[kind].splice(Number(index),1);save();draw(false);tell("Lançamento removido.");},
 hours:openHours,
 media:openMedia,
 camera:()=>pickFile("camera"),
 "image-picker":()=>pickFile("image"),
 "doc-picker":()=>pickFile("document"),
 "open-photo":value=>{ctx.arquivo={tipo:"foto",index:Number(value)};next("arquivo");},
 caption:value=>openSheet("Editar legenda",getForm("caption",`<input type="hidden" name="item" value="${esc(value)}">${field("Legenda","legenda",diario().fotos[Number(value)]?.nome)}${submit("Salvar legenda")}`)),
 "save-local":()=>{diario().envio="Salvo no aparelho";const kept=save();draw(false);tell(kept?"Rascunho salvo neste aparelho.":"Rascunho mantido nesta sessão.");},
 "send-review":()=>{
  const d=diario();
  if(data.offline){tell("Sem conexão para enviar.");return;}
  if(!d.atividades.length&&!d.ocorrencias.length&&!d.fotos.length){tell("Registre uma atividade, ocorrência ou foto.");return;}
  d.status="Em revisão";d.envio="Salvo online";d.motivo="";d.historico.push("Enviado para revisão.");save();next("visualizar");
 },
 review:openReview,
 signature:()=>next("assinar"),
 "clear-signature":()=>{const c=by("signature");c.getContext("2d").clearRect(0,0,c.width,c.height);c.dataset.signed="";},
 "use-signature":()=>{
  const canvas=by("signature");
  if(!canvas.dataset.signed){tell("Desenhe a assinatura antes de continuar.");return;}
  diario().assinado=true;save();back();openReview();
 },
 approve:()=>{const d=diario();d.status="Aprovado";d.historico.push("Aprovado na demonstração.");save();draw(false);tell("Diário aprovado.");},
 return:()=>openSheet("Devolver para correção",getForm("return",area("O que precisa ser corrigido?","motivo","",true)+submit("Devolver para correção"))),
 pdf:()=>{ctx.arquivo={tipo:"pdf"};next("arquivo");},
 print:()=>window.print(),
 retry:sendOne,
 "queue-send":()=>{
  if(data.offline){tell("Sem conexão para enviar.");return;}
  data.diarios.filter(d=>d.envio==="Salvo no aparelho"&&(!ctx.enviosObra||d.obra===ctx.enviosObra)).forEach(d=>{d.envio="Salvo online";});save();draw(false);tell("Rascunhos enviados na demonstração.");
 },
 password:()=>{const password=document.querySelector('input[name="senha"]');password.type=password.type==="password"?"text":"password";},
 "user-filter":value=>{ctx.userFilter=value;draw(false);},

function jump(to){
 if(to==="visualizar"||to==="assinar"){ctx.diario="revisao";ctx.obra="araucaria";}
 if(to==="arquivo"){ctx.diario="aprovado";ctx.arquivo={tipo:"pdf"};}
 if(to==="editor"){ctx.diario=data.diarios.find(d=>["Rascunho","Devolvido"].includes(d.status))?.id||makeDiary("norte").id;ctx.obra=diario().obra;openSection="eventos";}
 if(to==="cadastro-obra")ctx.editObra=false;
 if(to==="acessos")ctx.editUser=false;
 if(to==="envios")ctx.enviosObra="";
 next(to);
}
const forms={
 login:()=>{next("obras");tell("Modo demonstração. Nenhuma credencial foi enviada.");},
 recover:()=>{tell("Solicitação simulada. Nenhum e-mail foi enviado.");},
 profile:(spec,form)=>{if(spec.nova!==spec.confirmar){noteForm(form,"As senhas precisam ser iguais.");return;}form.reset();tell("Alteração demonstrada. Nenhuma senha foi salva.");},
 work:(spec,form)=>{
  if(!spec.nome.trim()){noteForm(form,"Informe o nome da obra.");return;}
  if(spec.inicio&&spec.fim&&spec.fim<spec.inicio){noteForm(form,"A previsão de término deve ser posterior ao início.");return;}
  if(ctx.editObra)Object.assign(obra(),spec);
  else{const w={id:id(),...spec};data.obras.unshift(w);ctx.obra=w.id;}
  save();next("resumo",{replace:true});
 },
 "search-obras":v=>{ctx.busca=v.termo.trim();draw(false);},
 "search-users":v=>{ctx.userSearch=v.termo.trim();draw(false);},
 "search-cat":v=>{ctx.catSearch=v.termo.trim();draw(false);},
 "diary-filters":(spec,form)=>{
  if(spec.from&&spec.to&&spec.to<spec.from){noteForm(form,"A data final deve ser posterior à inicial.");return;}
  ctx.fromDate=spec.from;ctx.toDate=spec.to;ctx.filtro=spec.status;draw(false);
 },
 "new-diary":spec=>{ctx.diario=makeDiary(ctx.obra,spec).id;openDiary(ctx.diario,true);},
 date:(spec,form)=>{
  if(data.diarios.some(x=>x.id!==diario().id&&x.obra===diario().obra&&x.data===spec.data)){noteForm(form,"Já existe um diário nessa data.");return;}
  diario().data=spec.data;save();closeSheet();draw(false);
 },
 entry:(spec,form)=>{
  const description=spec.descricao?.trim()||"";
  const name=spec.nome?.trim()||"";
  const quantity=Number(spec.quantidade);
  const usesQuantity=["equipe","equipamentos","materiais"].includes(spec.kind);
  if(!entryLabels[spec.kind]||(!usesQuantity&&!description)){noteForm(form,"Preencha a descrição.");return;}
  if(usesQuantity&&(!name||!Number.isFinite(quantity)||quantity<=0)){noteForm(form,"Informe o item e uma quantidade maior que zero.");return;}
  const label=usesQuantity?[quantity,spec.unidade?.trim()].filter(Boolean).join(" ")+" · "+name:description;
  const record=diario()[spec.kind];
  if(spec.item==="")record.push(label);else record[Number(spec.item)]=label;
  save();closeSheet();draw(false);
 },
 hours:(spec,form)=>{
  if(spec.entrada&&spec.saida&&spec.saida<spec.entrada){noteForm(form,"A saída deve ser posterior à entrada.");return;}
  if(spec.inicio&&spec.fim&&spec.fim<spec.inicio){noteForm(form,"O fim do intervalo deve ser posterior ao início.");return;}
  diario().jornada=spec;save();closeSheet();draw(false);
 },
 caption:spec=>{diario().fotos[Number(spec.item)].nome=spec.legenda;save();closeSheet();draw(false);},
 return:(spec,form)=>{
  if(!spec.motivo.trim()){noteForm(form,"Informe o motivo da devolução.");return;}
  const d=diario();d.status="Devolvido";d.motivo=spec.motivo.trim();d.assinado=false;d.historico.push("Devolvido para correção.");save();closeSheet();draw(false);tell("Diário devolvido.");
 },
 company:spec=>{if(spec.nome.trim()){data.empresa=spec.nome.trim();data.logo=spec.marcador;save();tell("Dados da empresa salvos na demonstração.");}},
 user:(spec,form,values)=>{
  if(!spec.nome.trim()){noteForm(form,"Informe o nome.");return;}
  if(data.usuarios.some(u=>u.email.toLowerCase()===spec.email.toLowerCase()&&(!ctx.editUser||u.id!==ctx.usuario))){noteForm(form,"Já existe um usuário com esse e-mail.");return;}
  const u={id:ctx.editUser?ctx.usuario:id(),...spec,obras:values.getAll("obras")};
  if(ctx.editUser)Object.assign(usuario(),u);else data.usuarios.unshift(u);
  save();next("usuarios",{replace:true});tell(ctx.editUser?"Dados de acesso atualizados.":"Usuário incluído. Envio de convite simulado.");
 },
 catalog:(spec,form)=>{
  if(!spec.nome.trim()){noteForm(form,"Informe o nome.");return;}
  const records=data.catalogos[ctx.catalogo];
  const {item,...values}=spec;
  if(item)Object.assign(records.find(o=>o.id===item),values);else records.unshift({id:id(),...values});
  save();closeSheet();draw(false);
 }
};
document.addEventListener("click",e=>{
 const target=e.target.closest("[data-action]");
 if(target){
  const {action,value}=target.dataset;
  const keep=["close","role","offline","return","screen-list","camera","image-picker","doc-picker"].includes(action);
  if(!keep)closeSheet();
  actions[action]?.(value);
 }else if(e.target===by("overlay"))closeSheet();
});
document.addEventListener("submit",e=>{
 const form=e.target;
 const submitAction=forms[form.dataset.form];
 if(!submitAction)return;
 e.preventDefault();
 const values=new FormData(form);
 submitAction(Object.fromEntries(values),form,values);
});
document.addEventListener("toggle",e=>{
 if(screen!=="editor"||e.target.tagName!=="DETAILS"||!e.target.dataset.section||!e.target.open)return;
 openSection=e.target.dataset.section;
 for(const other of by("app-content").querySelectorAll("details[data-section][open]"))if(other!==e.target)other.open=false;
},true);
document.addEventListener("keydown",e=>{
 if(e.key==="Escape"){closeSheet();return;}
 if(e.key!=="Tab"||by("overlay").hidden)return;
 const elements=[...by("sheet").querySelectorAll('button:not([disabled]), input:not([type="hidden"]), select, textarea, a[href]')];
 if(!elements.length)return;
 if(e.shiftKey&&document.activeElement===elements[0]){e.preventDefault();elements.at(-1).focus();}
 if(!e.shiftKey&&document.activeElement===elements.at(-1)){e.preventDefault();elements[0].focus();}
});
document.querySelectorAll("[data-icon]").forEach(el=>el.innerHTML=icon(el.dataset.icon));
by("guide-nav").innerHTML=[["obras","Obras e diário de hoje","works"],["editor","Preencher diário","edit"],["visualizar","Revisar e aprovar","check"],["envios","Acompanhar envios","cloud"]].map(([to,label,symbol])=>`<button type="button" class="guide-link" ${attrs("jump",to)}>${icon(symbol)}<strong>${label}</strong>${icon("next")}</button>`).join("");
by("screen-picker").innerHTML=Object.entries(titles).map(([value,title])=>`<option value="${value}">${esc(title)}</option>`).join("");
by("screen-picker").addEventListener("change",event=>jump(event.target.value));
const visit=location.hash.slice(1);
if(titles[visit]&&visit!=="obras")jump(visit);else draw();
